# File: compose.yaml
# Purpose: Run the API, dashboard, and optional PostgreSQL verification database locally.
name: player-telemetry-analytics-platform

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TELEMETRY_DB_PATH: /data/telemetry.duckdb
      TELEMETRY_CORS_ORIGINS: http://localhost:4173
    ports:
      - "8000:8000"
    volumes:
      - telemetry-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "4173:8080"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    profiles: ["verification"]
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  telemetry-data:
