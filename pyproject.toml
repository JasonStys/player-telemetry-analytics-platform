# File: pyproject.toml
# Purpose: Define the Python package, runtime dependencies, quality gates, and test configuration.
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "player-telemetry-analytics-platform"
version = "1.0.0"
description = "A synthetic, SQL-first game telemetry analytics platform with reproducible data quality evidence."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Jason Stys" }]
dependencies = [
  "duckdb==1.5.5",
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pytz>=2025.2,<2027",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
dev = [
  "hatchling>=1.27,<2",
  "httpx2==2.13.0",
  "hypothesis>=6.130,<7",
  "mypy>=1.17,<3",
  "pip-audit>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "pytest==9.1.1",
  "pytest-cov>=6.2,<8",
  "ruff==0.16.8",
]

[project.scripts]
telemetry-platform = "telemetry_platform.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry_platform"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "telemetry_platform/sql"


[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -p no:cacheprovider --basetemp=.test-runtime --cov=telemetry_platform --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=95"
testpaths = ["tests"]
markers = [
  "postgres: requires TELEMETRY_POSTGRES_DSN and a PostgreSQL server",
  "performance: deterministic performance budget checks",
]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.coverage.run]
branch = true
source = ["telemetry_platform"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ARG", "B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PL", "RUF", "S", "SIM", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["telemetry_platform"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["duckdb"]
ignore_missing_imports = true
