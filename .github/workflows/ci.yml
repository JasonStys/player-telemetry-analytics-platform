# File: ci.yml
# Purpose: Verify Python, SQL, TypeScript, PostgreSQL, browser, repository, performance, and containers.
# Jobs: independent least-privilege checks run on pushes, pull requests, and manual dispatch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python and DuckDB verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install package and verification tools
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Verify formatting, linting, and strict types
        run: |
          python -m ruff format --check src tests
          python -m ruff check src tests
          python -m mypy
      - name: Run Python, DuckDB, API, and property tests
        run: python -m pytest -m "not postgres"
      - name: Audit Python dependencies
        run: >-
          python -m pip_audit --strict --disable-pip --no-deps
          --progress-spinner off --requirement requirements.lock
      - name: Enforce performance budget
        run: |
          python -m telemetry_platform.cli benchmark \
            --report docs/reports/generated/benchmark.json
      - name: Upload Python evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-reports
          path: |
            coverage.xml
            htmlcov
            docs/reports/generated/benchmark.json
          if-no-files-found: error

  frontend:
    name: TypeScript dashboard verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        run: npm ci
      - name: Verify dashboard
        working-directory: web
        run: npm run verify
      - name: Audit production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Upload dashboard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-reports
          path: |
            web/coverage
            web/dist
          if-no-files-found: error

  postgres:
    name: PostgreSQL 18.6 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: telemetry
          POSTGRES_USER: telemetry
          POSTGRES_PASSWORD: telemetry-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telemetry -d telemetry"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TELEMETRY_POSTGRES_DSN: postgresql://telemetry:telemetry-ci-only@127.0.0.1:5432/telemetry
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install package and PostgreSQL tools
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Verify PostgreSQL schema behavior
        run: python -m pytest -m postgres --no-cov

  browser:
    name: Chromium end-to-end verification
    runs-on: ubuntu-latest
    env:
      TELEMETRY_DB_PATH: /tmp/telemetry-e2e.duckdb
      TELEMETRY_BOOTSTRAP_DEMO: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install application dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          cd web
          npm ci
          npx playwright install --with-deps chromium
      - name: Run real-browser workflow
        working-directory: web
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: warn

  repository:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Validate documentation and source headers
        run: node scripts/validate-repository.mjs
      - name: Confirm generated code index is current
        run: node scripts/generate-code-index.mjs --check
      - name: Validate shell syntax
        run: bash -n scripts/verify.sh scripts/demo.sh
      - name: Validate Compose model
        run: docker compose config --quiet

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build application images
        run: docker compose build api web
